<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPPM ITB Yadika - Verifikasi OTP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 0;
        }
        .circle-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .circle-2 { width: 300px; height: 300px; bottom: -50px; right: -50px; }

        .container {
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .brand-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 16px;
            background: #f8fafc;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }

        .brand-title-main {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            text-align: center;
        }

        .brand-subtitle-main {
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .page-description {
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.5;
        }

        .email-badge {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .email-badge strong {
            color: #1e293b;
            word-break: break-all;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #475569;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        .otp-input {
            width: 100%;
            padding: 14px 16px;
            background: #f8fafc;
            border: 2px dashed #667eea;
            border-radius: 12px;
            color: #4338ca;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 8px;
            font-family: monospace;
            transition: all 0.2s ease;
        }

        .otp-input:focus {
            outline: none;
            border-style: solid;
            border-color: #667eea;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message-alert {
            padding: 13px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13.5px;
            font-weight: 600;
        }

        .message-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .message-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .message-info {
            background: #e0e7ff;
            color: #3730a3;
            border: 1px solid #c7d2fe;
        }

        .resend-box {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #64748b;
        }

        .resend-btn {
            background: none;
            border: none;
            color: #667eea;
            font-weight: 700;
            cursor: pointer;
        }

        .resend-btn:disabled {
            color: #94a3b8;
            cursor: not-allowed;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
        }

        .back-link a {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-circle circle-1"></div>
    <div class="ambient-circle circle-2"></div>

    <div class="container">
        <div class="brand-logo-container">
            <img src="yadika.png" alt="Logo ITB Yadika" class="brand-logo">
            <div class="brand-title-main">LPPM ITB YADIKA</div>
            <div class="brand-subtitle-main">Verifikasi Kode OTP</div>
        </div>

        <div id="alertBox"></div>

        <div class="page-header">
            <h2>Masukkan Kode OTP</h2>
            <p class="page-description">
                Kode verifikasi 6 digit telah dikirimkan ke email Anda.
            </p>
        </div>

        <div class="email-badge">
            <span>Email: <strong id="displayEmail">-</strong></span>
            <a href="lupa-password.html" style="color: #667eea; font-weight: 700; text-decoration: none; font-size: 12px;">Ubah</a>
        </div>

        <form id="otpForm">
            <div class="form-group">
                <label for="inputOtp">6 Digit Kode Verifikasi</label>
                <input type="text" id="inputOtp" class="otp-input" maxlength="6" placeholder="••••••" required autocomplete="one-time-code" inputmode="numeric">
            </div>

            <button type="submit" class="btn" id="btnVerify">
                <span id="btnText">Verifikasi Kode OTP</span>
            </button>
        </form>

        <div class="resend-box">
            Tidak menerima kode? 
            <button type="button" id="btnResend" class="resend-btn">Kirim Ulang</button>
            <div id="countdownBox" style="font-size: 12px; color: #94a3b8; margin-top: 4px; display: none;">
                Kirim ulang dapat dilakukan dalam <span id="timerCount">60</span>s
            </div>
        </div>

        <div class="back-link">
            <a href="lupa-password.html">← Kembali</a>
        </div>
    </div>

    <script>
        const getBaseUrl = () => {
            const hostname = window.location.hostname;
            const protocol = window.location.protocol;
            if (protocol === 'file:') return 'http://localhost:3000';
            const isLocal = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '';
            return isLocal ? `${protocol}//${hostname || 'localhost'}:3000` : '';
        };

        const API_BASE = getBaseUrl();
        const urlParams = new URLSearchParams(window.location.search);
        let targetEmail = urlParams.get('email') || sessionStorage.getItem('reset_email') || '';

        if (!targetEmail) {
            window.location.href = 'lupa-password.html';
        } else {
            document.getElementById('displayEmail').textContent = targetEmail;
        }

        const devOtp = sessionStorage.getItem('dev_otp');
        if (devOtp) {
            document.getElementById('inputOtp').value = devOtp;
            document.getElementById('alertBox').innerHTML = `<div class="message-alert message-info">Mode Development OTP: <strong>${devOtp}</strong></div>`;
        }

        // Handle Verify OTP
        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const otp = document.getElementById('inputOtp').value.trim();
            const btn = document.getElementById('btnVerify');
            const btnText = document.getElementById('btnText');
            const alertBox = document.getElementById('alertBox');

            if (!otp || otp.length !== 6) {
                alertBox.innerHTML = `<div class="message-alert message-error">Kode OTP harus berisi 6 digit angka!</div>`;
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Memverifikasi...';

            try {
                const response = await fetch(`${API_BASE}/api/auth/verify-reset-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: targetEmail, code: otp })
                });

                const data = await response.json();
                btn.disabled = false;
                btnText.textContent = 'Verifikasi Kode OTP';

                if (response.ok && data.success) {
                    sessionStorage.setItem('reset_otp', otp);
                    window.location.href = `reset-password.html?email=${encodeURIComponent(targetEmail)}&otp=${encodeURIComponent(otp)}`;
                } else {
                    alertBox.innerHTML = `<div class="message-alert message-error">${data.message || 'Kode OTP salah atau telah kadaluarsa.'}</div>`;
                }
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btnText.textContent = 'Verifikasi Kode OTP';
                alertBox.innerHTML = `<div class="message-alert message-error">Terjadi kesalahan koneksi server.</div>`;
            }
        });

        // Resend OTP logic
        let timer = null;
        function startTimer(sec = 60) {
            const btnResend = document.getElementById('btnResend');
            const countdownBox = document.getElementById('countdownBox');
            const timerCount = document.getElementById('timerCount');

            btnResend.disabled = true;
            countdownBox.style.display = 'block';
            let left = sec;
            timerCount.textContent = left;

            if (timer) clearInterval(timer);

            timer = setInterval(() => {
                left--;
                timerCount.textContent = left;
                if (left <= 0) {
                    clearInterval(timer);
                    btnResend.disabled = false;
                    countdownBox.style.display = 'none';
                }
            }, 1000);
        }

        document.getElementById('btnResend').addEventListener('click', async function() {
            this.disabled = true;
            const alertBox = document.getElementById('alertBox');

            try {
                const response = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: targetEmail })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.data && data.data.devOtp) {
                        sessionStorage.setItem('dev_otp', data.data.devOtp);
                        document.getElementById('inputOtp').value = data.data.devOtp;
                        alertBox.innerHTML = `<div class="message-alert message-info">Kode OTP baru dikirim. Mode Dev: <strong>${data.data.devOtp}</strong></div>`;
                    } else {
                        alertBox.innerHTML = `<div class="message-alert message-success">Kode OTP baru telah dikirimkan ke email Anda.</div>`;
                    }
                    startTimer(60);
                } else {
                    alertBox.innerHTML = `<div class="message-alert message-error">${data.message || 'Gagal mengirim ulang OTP.'}</div>`;
                    this.disabled = false;
                }
            } catch (e) {
                alertBox.innerHTML = `<div class="message-alert message-error">Gagal menghubungi server.</div>`;
                this.disabled = false;
            }
        });

        startTimer(60);
    </script>
</body>
</html>
