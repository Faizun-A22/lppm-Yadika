<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPPM ITB Yadika - Ubah Kata Sandi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 0;
        }
        .circle-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .circle-2 { width: 300px; height: 300px; bottom: -50px; right: -50px; }

        .container {
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .brand-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 16px;
            background: #f8fafc;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }

        .brand-title-main {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            text-align: center;
        }

        .brand-subtitle-main {
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .page-description {
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: #475569;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            color: #1e293b;
            font-size: 14.5px;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 14px;
            padding: 4px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message-alert {
            padding: 13px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13.5px;
            font-weight: 600;
        }

        .message-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .message-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .success-icon-box {
            width: 72px;
            height: 72px;
            background: #d1fae5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 34px;
            color: #059669;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
        }

        .back-link a {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-circle circle-1"></div>
    <div class="ambient-circle circle-2"></div>

    <div class="container">
        <div class="brand-logo-container">
            <img src="yadika.png" alt="Logo ITB Yadika" class="brand-logo">
            <div class="brand-title-main">LPPM ITB YADIKA</div>
            <div class="brand-subtitle-main">Ubah Kata Sandi</div>
        </div>

        <div id="alertBox"></div>

        <!-- Form Ubah Password -->
        <div id="formSection">
            <div class="page-header">
                <h2>Buat Kata Sandi Baru</h2>
                <p class="page-description">
                    Masukkan kata sandi baru Anda untuk akun <strong id="displayEmail">-</strong>.
                </p>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">Kata Sandi Baru</label>
                    <div class="input-wrapper">
                        <input type="password" id="newPassword" required minlength="6" placeholder="Minimal 6 karakter" autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('newPassword', this)">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Kata Sandi Baru</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" required minlength="6" placeholder="Ulangi kata sandi baru" autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn" id="btnSave">
                    <span id="btnText">Simpan Kata Sandi Baru</span>
                </button>
            </form>

            <div class="back-link">
                <a href="login.html">← Batalkan</a>
            </div>
        </div>

        <!-- Section Berhasil -->
        <div id="successSection" style="display: none;">
            <div class="page-header" style="margin-top: 15px;">
                <div class="success-icon-box">✓</div>
                <h2>Kata Sandi Berhasil Diubah!</h2>
                <p class="page-description">
                    Kata sandi akun Anda telah berhasil diperbarui. Silakan login kembali dengan kata sandi baru Anda.
                </p>
            </div>

            <a href="login.html" class="btn">
                Masuk ke Akun Sekarang
            </a>
        </div>
    </div>

    <script>
        const getBaseUrl = () => {
            const hostname = window.location.hostname;
            const protocol = window.location.protocol;
            const port = window.location.port;
            if (protocol === 'file:') return 'http://localhost:3000';
            if (port === '3000') return '';
            const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';
            return isLocal ? `${protocol}//${hostname}:3000` : '';
        };

        const API_BASE = getBaseUrl();
        const urlParams = new URLSearchParams(window.location.search);
        
        let email = urlParams.get('email') || sessionStorage.getItem('reset_email') || '';
        let otp = urlParams.get('otp') || sessionStorage.getItem('reset_otp') || '';
        let token = urlParams.get('token') || '';

        if (!email) {
            window.location.href = 'lupa-password.html';
        } else {
            document.getElementById('displayEmail').textContent = email;
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🔒';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('btnSave');
            const btnText = document.getElementById('btnText');
            const alertBox = document.getElementById('alertBox');

            if (newPassword.length < 6) {
                alertBox.innerHTML = `<div class="message-alert message-error">Password baru minimal 6 karakter.</div>`;
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.innerHTML = `<div class="message-alert message-error">Konfirmasi password tidak cocok!</div>`;
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Menyimpan...';
            alertBox.innerHTML = '';

            try {
                const payload = {
                    email,
                    newPassword,
                    confirmPassword
                };
                if (otp) payload.otp = otp;
                if (token) payload.token = token;

                const response = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                btn.disabled = false;
                btnText.textContent = 'Simpan Kata Sandi Baru';

                if (response.ok && data.success) {
                    sessionStorage.removeItem('reset_email');
                    sessionStorage.removeItem('reset_otp');
                    sessionStorage.removeItem('dev_otp');
                    document.getElementById('formSection').style.display = 'none';
                    document.getElementById('successSection').style.display = 'block';
                } else {
                    alertBox.innerHTML = `<div class="message-alert message-error">${data.message || 'Gagal mengubah kata sandi.'}</div>`;
                }
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btnText.textContent = 'Simpan Kata Sandi Baru';
                alertBox.innerHTML = `<div class="message-alert message-error">Terjadi kesalahan koneksi server.</div>`;
            }
        });
    </script>
</body>
</html>
