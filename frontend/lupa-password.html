<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPPM ITB Yadika - Lupa Kata Sandi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 0;
        }
        .circle-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .circle-2 { width: 300px; height: 300px; bottom: -50px; right: -50px; }

        .container {
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .brand-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 16px;
            background: #f8fafc;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }

        .brand-title-main {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            text-align: center;
        }

        .brand-subtitle-main {
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .page-description {
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #475569;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            color: #1e293b;
            font-size: 14.5px;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message-alert {
            padding: 13px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13.5px;
            font-weight: 600;
        }

        .message-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .message-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
        }

        .back-link a {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-circle circle-1"></div>
    <div class="ambient-circle circle-2"></div>

    <div class="container">
        <div class="brand-logo-container">
            <img src="yadika.png" alt="Logo ITB Yadika" class="brand-logo">
            <div class="brand-title-main">LPPM ITB YADIKA</div>
            <div class="brand-subtitle-main">Layanan Pemulihan Akun</div>
        </div>

        <div id="alertBox"></div>

        <div class="page-header">
            <h2>Lupa Kata Sandi?</h2>
            <p class="page-description">
                Masukkan alamat email akun Anda. Kami akan mengirimkan kode verifikasi (OTP) untuk mereset kata sandi.
            </p>
        </div>

        <form id="requestForm">
            <div class="form-group">
                <label for="inputEmail">Alamat Email Terdaftar</label>
                <input type="email" id="inputEmail" required placeholder="nama@mahasiswa.yadika.ac.id" autocomplete="email">
            </div>

            <button type="submit" class="btn" id="btnSubmit">
                <span id="btnText">Kirim Kode OTP</span>
            </button>
        </form>

        <div class="back-link">
            <a href="login.html">← Kembali ke Halaman Masuk</a>
        </div>
    </div>

    <script>
        const getBaseUrl = () => {
            const hostname = window.location.hostname;
            const protocol = window.location.protocol;
            const port = window.location.port;
            if (protocol === 'file:') return 'http://localhost:3000';
            if (port === '3000') return '';
            const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';
            return isLocal ? `${protocol}//${hostname}:3000` : '';
        };

        const API_BASE = getBaseUrl();

        document.getElementById('requestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('inputEmail').value.trim();
            const btn = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const alertBox = document.getElementById('alertBox');

            if (!email) return;

            btn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Mengirim OTP...';
            alertBox.innerHTML = '';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                const response = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await response.json();
                btn.disabled = false;
                btnText.textContent = 'Kirim Kode OTP';

                if (response.ok && data.success) {
                    sessionStorage.setItem('reset_email', email);
                    window.location.href = `verifikasi-otp.html?email=${encodeURIComponent(email)}`;
                } else {
                    alertBox.innerHTML = `<div class="message-alert message-error">${data.message || 'Gagal mengirim kode OTP.'}</div>`;
                }
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btnText.textContent = 'Kirim Kode OTP';
                alertBox.innerHTML = `<div class="message-alert message-error">Terjadi kesalahan jaringan. Silakan coba lagi.</div>`;
            }
        });
    </script>
</body>
</html>
